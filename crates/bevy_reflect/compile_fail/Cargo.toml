[package]
name = "bevy_reflect_compile_fail"
edition = "2024"
description = "Compile fail tests for Bevy Engine's reflection system"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Needed by the ui tests under `tests/`; they compile their own crates, which resolve this from here.
bevy_reflect = { path = "../", features = ["functions"] }

[dev-dependencies]
compile_fail_utils = { path = "../../../tools/compile_fail_utils" }

[[test]]
name = "derive"
harness = false

[[test]]
name = "func"
harness = false

[[test]]
name = "remote"
harness = false

[lints]
workspace = true
