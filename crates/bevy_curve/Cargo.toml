[package]
description  = "Provides math functionality for Bevy Engine"
edition      = "2024"
homepage     = "https://bevy.org"
keywords     = ["bevy"]
license      = "MIT OR Apache-2.0"
name         = "bevy_curve"
repository   = "https://github.com/bevyengine/bevy"
rust-version = "1.94.0"
version      = "0.20.0-dev"

[dependencies]
approx = { default-features = false, optional = true, version = "0.5" }
bevy_math = { default-features = false, features = [
  "approx",
], path = "../bevy_math", version = "0.20.0-dev" }
bevy_reflect = { default-features = false, features = [
  "glam",
], optional = true, path = "../bevy_reflect", version = "0.20.0-dev" }
itertools = { default-features = false, version = "0.14.0" }
serde = { default-features = false, features = [
  "derive",
], optional = true, version = "1" }
thiserror = { default-features = false, version = "2" }
variadics_please = "2.0"

[dev-dependencies]
approx = "0.5"
# Enable the approx feature when testing.
bevy_math = { default-features = false, features = [
  "approx",
], path = "../bevy_math", version = "0.20.0-dev" }


[features]
alloc = ["itertools/use_alloc", "serde?/alloc"]
default = ["std"]
std = [
  "alloc",
  "approx?/std",
  "bevy_math/std",
  "bevy_reflect?/std",
  "itertools/use_std",
  "serde?/std",
]

serialize = ["bevy_math/serialize", "dep:serde"]
# Enable approx for bevy_math types to approximate floating point equality comparisons and assertions
approx = ["bevy_math/approx", "dep:approx"]
# Enable bevy_reflect (requires alloc)
bevy_reflect = ["alloc", "dep:bevy_reflect"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--generate-link-to-definition",
  "--generate-macro-expansion",
  "-Zunstable-options",
]
