[package]
name = "bevy_gilrs"
version = "0.20.0-dev"
edition = "2024"
description = "Gamepad system made using Gilrs for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
# Use WGI on Windows targets. No effect on other targets. Mutually incompatible with `xinput`.
wgi = ["gilrs/wgi"]
# Use XInput on Windows targets (which is compatible with Wine). Mutually incompatible with `wgi`.
xinput = ["gilrs/xinput"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_input = { path = "../bevy_input", version = "0.20.0-dev", features = [
  "gamepad",
] }
bevy_time = { path = "../bevy_time", version = "0.20.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
gilrs = { version = "0.11", default-features = false }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
