[package]
name = "bevy_reflect2_macros"
version = "0.20.0-dev"
description = "Bevy Reflect Macros"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[features]
default = []
# Enables automatic reflect registration. Does nothing by itself,
# must select `auto_register_inventory` or `auto_register_static` to make it work.
auto_register = []
# Enables automatic reflection using inventory. Not supported on all platforms.
auto_register_inventory = ["auto_register"]
# Enables automatic reflection on platforms not supported by inventory. See `load_type_registrations` for more info.
auto_register_static = ["auto_register", "dep:uuid"]

[dependencies]
bevy_macro_utils = { path = "../../bevy_macro_utils", version = "0.20.0-dev" }

syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
uuid = { version = "1.21.0", default-features = false, features = [
  "v4",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
uuid = { version = "1.21.0", default-features = false, features = ["js"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
