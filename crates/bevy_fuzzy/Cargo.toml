[package]
name = "bevy_fuzzy"
version = "0.20.0-dev"
edition = "2024"
description = "A small fuzzy matcher for Bevy tools such as inspectors, pickers and command palettes"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "fuzzy"]

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
