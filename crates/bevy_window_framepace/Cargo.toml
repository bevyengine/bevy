[package]
name = "bevy_window_framepace"
version = "0.20.0-dev"
edition = "2024"
description = "Provides frame pacing and frame limiting for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
framepace_debug = ["dep:bevy_log", "dep:bevy_diagnostic"]

[dependencies]
# bevy
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.20.0-dev" }
bevy_reflect = { path = "../bevy_reflect", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }
bevy_window = { path = "../bevy_window", version = "0.20.0-dev" }

# bevy optional
bevy_diagnostic = { path = "../bevy_diagnostic", version = "0.20.0-dev", optional = true }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spin_sleep = "1.3"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
