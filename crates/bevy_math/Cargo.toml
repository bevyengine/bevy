[package]
description = "Provides math functionality for Bevy Engine"
edition = "2024"
homepage = "https://bevy.org"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
name = "bevy_math"
repository = "https://github.com/bevyengine/bevy"
rust-version = "1.94.0"
version = "0.20.0-dev"

[dependencies]
approx = { default-features = false, optional = true, version = "0.5" }
bevy_reflect = { default-features = false, features = [
  "glam",
], optional = true, path = "../bevy_reflect", version = "0.20.0-dev" }
derive_more = { default-features = false, features = [
  "from",
  "into",
], version = "2" }
glam = { default-features = false, features = ["bytemuck"], version = "0.33.2" }
itertools = { default-features = false, version = "0.14.0" }
libm = { optional = true, version = "0.2" }
rand = { default-features = false, optional = true, version = "0.10" }
serde = { default-features = false, features = [
  "derive",
], optional = true, version = "1" }
thiserror = { default-features = false, version = "2" }
variadics_please = "2.0"

[dev-dependencies]
approx = "0.5"
# Supply rngs for examples and tests
chacha20 = { default-features = false, features = ["rng"], version = "0.10.0" }
rand = "0.10"
# Enable the approx feature when testing.
bevy_math = { default-features = false, features = ["approx"], path = "." }
glam = { default-features = false, features = ["approx"], version = "0.33.2" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { default-features = false, features = [
  "wasm_js",
], version = "0.4" }

[features]
alloc = ["itertools/use_alloc", "rand?/alloc", "serde?/alloc"]
default = ["curve", "rand", "std"]
std = [
  "alloc",
  "approx?/std",
  "bevy_reflect?/std",
  "derive_more/std",
  "glam/std",
  "itertools/use_std",
  "rand?/std",
  "serde?/std",
]

serialize = ["dep:serde", "glam/serde"]
# Enable approx for glam types to approximate floating point equality comparisons and assertions
approx = ["dep:approx", "glam/approx"]
# Enable interoperation of glam types with mint-compatible libraries
mint = ["glam/mint"]
# Enable libm mathematical functions for glam types to ensure consistent outputs
# across platforms at the cost of losing hardware-level optimization using intrinsics
libm = ["dep:libm", "glam/libm"]
# Enable assertions to check the validity of parameters passed to glam
glam_assert = ["glam/glam-assert"]
# Enable assertions in debug builds to check the validity of parameters passed to glam
debug_glam_assert = ["glam/debug-glam-assert"]
# Enable the rand dependency for shape_sampling
rand = ["dep:rand", "glam/rand"]
# Include code related to the Curve trait
curve = []
# Enable bevy_reflect (requires alloc)
bevy_reflect = ["alloc", "dep:bevy_reflect"]
# Enable libm mathematical functions as a fallback for no_std environments.
# Can be overridden with std feature.
nostd-libm = ["dep:libm", "glam/nostd-libm"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "--generate-link-to-definition",
  "--generate-macro-expansion",
  "-Zunstable-options",
]
