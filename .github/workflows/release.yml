name: Release

# Publishes every crate of the workspace to crates.io using Trusted Publishing.
#
# Must be triggered on the release tag
#
# Design decisions:
# - not using --workspace but specifying crates to be able to restart in case of any issue
# - --no-verify in publish: it holds a temp crates.io token
#   - valid only 30 minutes, so no time to build everything
#   - build scripts are ran on verify, so don't run them with the token available
# - check does basic validation: the tag matches the crate version and it isn't already published, and a dry-run

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check release
    if: github.repository == 'bevyengine/bevy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-rust

      - name: Check version and ref
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bevy") | .version')

          # tag matches the version
          if [ "$REF" != "refs/tags/v$version" ]; then
            echo "::error::This workflow must run on the tag v$version, not on $REF"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        uses: $/.github/actions/install-linux-deps

      - name: List crates to publish
        id: crates
        run: |
          crates=$(.github/scripts/unpublished-crates.sh)
          echo "packages=$(echo "$crates" | sed '/^$/d' | sed 's/^/-p /' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Package and build (dry run)
        if: steps.crates.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.crates.outputs.packages }}
        run: |
          cargo publish --dry-run $PACKAGES

  publish:
    name: Publish to crates.io
    needs: check
    if: github.repository == 'bevyengine/bevy'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/bevy/${{ needs.check.outputs.version }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/install-rust

      - name: List crates to publish
        id: crates
        run: |
          crates=$(.github/scripts/unpublished-crates.sh)
          echo "packages=$(echo "$crates" | sed '/^$/d' | sed 's/^/-p /' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: steps.crates.outputs.packages != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.crates.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGES: ${{ steps.crates.outputs.packages }}
        run: |
          cargo publish --no-verify $PACKAGES
